name: Deploy to Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            export COMPOSER_ALLOW_SUPERUSER=1

            # Lockfile requires PHP >= 8.4.1 — prefer php8.4 over distro default 8.3.
            if command -v php8.4 >/dev/null 2>&1; then
              export PATH="/usr/bin:${PATH}"
              update-alternatives --set php /usr/bin/php8.4 >/dev/null 2>&1 || true
            fi

            php -v
            php -r 'exit(version_compare(PHP_VERSION, "8.4.1", ">=") ? 0 : 1);' \
              || { echo "PHP >= 8.4.1 required on the droplet"; exit 1; }

            cd /opt/status

            git fetch origin
            git reset --hard origin/main

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            npm ci
            npm run build

            php artisan migrate --force
            php artisan storage:link --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            if systemctl list-unit-files | grep -qE '^php8\.4-fpm\.service'; then
              systemctl reload php8.4-fpm
            elif systemctl list-unit-files | grep -qE '^php[0-9.]*-fpm\.service'; then
              systemctl reload php8.3-fpm 2>/dev/null \
                || systemctl reload php8.2-fpm 2>/dev/null \
                || true
            fi

            if systemctl list-unit-files | grep -q '^nginx\.service'; then
              nginx -t
              systemctl reload nginx
            fi
